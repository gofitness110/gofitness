<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>開練吧｜新的約課入口</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="開練吧">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<!-- 沒開 JavaScript 時也會轉過去 -->
<meta http-equiv="refresh" content="1;url=https://gofitness.gofitness.workers.dev/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8F7F3;color:#303632;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;text-align:center}
  .box{padding:32px 24px;max-width:420px}
  h1{font-size:1.35em;color:#526E63;margin:0 0 10px}
  p{line-height:1.7;margin:0 0 22px;color:#929892}
  a.go{display:block;padding:15px;border-radius:999px;background:#91AD9C;color:#303632;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>開練吧 約課系統搬新家了</h1>
  <p>正在帶你前往新的入口。<br>登入帳號與手機末 4 碼都跟以前一樣。<br>建議重新「加入主畫面」，之後從新的捷徑進入。</p>
  <a class="go" id="go" href="https://gofitness.gofitness.workers.dev/">前往新入口</a>
</div>
<script>
(function(){
  // 保留網址後面的參數（例如老師入口的 ?role=teacher）
  var url='https://gofitness.gofitness.workers.dev/'+(location.search||'')+(location.hash||'');
  var a=document.getElementById('go');if(a)a.href=url;
  setTimeout(function(){location.replace(url);},300);
})();
</script>
</body>
</html>
